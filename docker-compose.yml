x-php: &php
  image: notification-hub-php:dev
  working_dir: /var/www
  restart: unless-stopped
  init: true
  volumes:
    - ${BACKEND_PATH:-./project_back}:/var/www
  environment:
    COMPOSER_HOME: /tmp/composer
    COMPOSER_CACHE_DIR: /tmp/composer-cache

services:
  app:
    <<: *php
    build:
      context: ./project_back
      dockerfile: ../docker/php/Dockerfile
      target: development
      additional_contexts:
        libxml2_backport: ./docker/libxml2
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SCRIPT_FILENAME=/var/www/public/index.php SCRIPT_NAME=/index.php
          REQUEST_URI=/up REQUEST_METHOD=GET SERVER_NAME=localhost
          SERVER_PORT=80 SERVER_PROTOCOL=HTTP/1.1
          cgi-fcgi -bind -connect 127.0.0.1:9000 |
          php -r '$$r=stream_get_contents(STDIN); $$s=preg_match("/^Status: ([0-9]{3})/mi", $$r, $$m) ? (int) $$m[1] : 200; exit(($$s === 200 && stripos($$r, "content-type:") !== false) ? 0 : 1);'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  worker:
    <<: *php
    command: [php, artisan, 'queue:work', redis, '--sleep=1', '--tries=3', '--timeout=60']
    stop_grace_period: 75s
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  nginx:
    image: notification-hub-nginx:dev
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
      additional_contexts:
        libxml2_backport: ./docker/libxml2
    restart: unless-stopped
    ports:
      - '127.0.0.1:${HTTP_PORT:-8080}:80'
    volumes:
      - ${BACKEND_PATH:-./project_back}:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: [CMD, wget, '-q', '-O', /dev/null, 'http://127.0.0.1/up']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      app:
        condition: service_healthy

  redis:
    image: docker.io/library/redis:8.10.3-alpine@sha256:896f241f438ab6a210cfb24f573b84bea721a4cbe67f1b4fd07eb638b3b02a7b
    restart: unless-stopped
    command: [redis-server, '--appendonly', 'yes', '--appendfsync', everysec]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  mailpit:
    image: '${MAILPIT_IMAGE:-docker.io/axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498}'
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAIL_UI_PORT:-8025}:8025'
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  redis-data:
